# Deploy del Worker cv-failover a Cloudflare.
# Solo se dispara cuando cambia cv-failover/** en main.
# Requiere secretos del repo: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers:
# Account Workers Scripts Write + Zone Workers Routes Edit en victor-service.dev)
# y CLOUDFLARE_ACCOUNT_ID.
name: Deploy cv-failover worker

on:
  push:
    branches: [main]
    paths:
      - 'cv-failover/**'
      - '.github/workflows/deploy-cv-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-failover
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check src/worker.js

      - name: Deploy with Wrangler
        run: npx -y wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
